<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">   
</head>
<body>

    <div class="container min-vh-100 d-flex justify-content-center align-items-center py-4">
        <div class="row w-100 justify-content-center">
            
            <div class="col-11 col-sm-9 col-md-7 col-lg-5 col-xl-4">
                
                <div class="login-card">
                    <h2>Login</h2>
                    <form id="loginForm">       
                        <label>Email:</label>
                        <input type="email" id="loginEmail">
                        <br><br>      
                        
                        <label>Password:</label>
                        <input type="password" id="loginPassword">
                        <br><br>
               
                        <button type="submit" class="btn btn-success d-block mx-auto">Login</button>
                        <small id="loginError" class="error-msg"></small>
                    </form>

                    <div class="signup-link">
                        Don't have an account? <a href="signup.html">Create one</a>
                    </div>
                </div>

            </div>
        </div>
    </div> 

    <script type="module" src="auth.js"></script>
</body>
</html>
